# resumption-index — Afeto em Forma
# versao: 2.0
# data: 2026-06-03
# tipo: grafo_navegacao / camada_derivada
# fonte: derivado exclusivamente de ciclos que satisfaçam todos os critérios:
#   - ciclo CONCLUÍDO (estado final CONCLUÍDO, não FALHOU)
#   - merge realizado (branch ops/ mergeada para main)
#   - gate humano cumprido (aprovação explícita registrada)
#   - telemetria registrada (telemetria de sessão commitada)
#   NÃO atualizar a partir de ciclos FALHOU, sessões sem merge ou retomadas parciais
# regra_de_uso: consultar apenas na Etapa 0b — não substitui snapshot, telemetria ou handoff
# fallback: se entrada ausente ou confianca < média → r-recuperacao-contextual + index.md
#
# MUDANÇA v2.0 (T5.2 — 2026-06-03):
#   snapshot_ref renomeado para snapshot_minimo.
#   snapshot_minimo é o 5º elemento do caminho operacional — não metadado de proveniência.
#   null = domínio sem telemetria diretamente localizável → usar r-recuperacao-contextual.

